<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLLY browser preview (in-tab demo)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* gpui_web creates its own canvas and appends it to <body> with
         width/height 100% — the page must give body a real height and no
         competing block elements, or the canvas lands below the fold. */
      html,
      body {
        width: 100%;
        height: 100%;
      }

      /* Pre-app loading chrome only: DESIGN.md dark-canvas tokens
         (canvas-dark / ink-dark), replaced by the gpui theme once the wasm
         module takes over. Fixed overlay so it never affects layout. */
      body {
        font-family: system-ui, sans-serif;
        overflow: hidden;
        background: #151515;
        color: #e8e8e8;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #151515;
        z-index: 10;
      }

      .logo {
        width: clamp(96px, 18vmin, 160px);
        height: auto;
      }

      .wordmark {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }

      .progress-track {
        width: min(320px, 70vw);
        height: 4px;
        border-radius: 2px;
        background: #353535; /* hairline-dark */
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: #68b2ef; /* accent-azure-dark */
        transition: width 120ms linear;
      }

      /* Indeterminate sweep for the compile phase, when there are no bytes
         left to count but the app is not yet interactive. */
      .progress-fill.indeterminate {
        width: 40%;
        animation: sweep 1.1s ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      .status {
        font-size: 13px;
        color: #a1a1a1; /* ink-muted-dark */
        font-variant-numeric: tabular-nums;
      }

      /* Something to read while 30+ MB download: the native app has no such
         wait, and one second is a surprisingly long time everywhere else. */
      .native-note {
        margin-top: 28px;
        max-width: min(440px, 80vw);
        text-align: center;
      }

      .native-note .lead {
        font-size: 14px;
        color: #e8e8e8; /* ink-dark */
      }

      .native-note .fact {
        margin-top: 10px;
        font-size: 13px;
        color: #a1a1a1; /* ink-muted-dark */
        min-height: 2.6em;
        opacity: 1;
        transition: opacity 400ms ease;
      }

      .native-note .fact.fading {
        opacity: 0;
      }

      .error {
        color: #f46f68; /* error-dark */
        padding: 20px;
        text-align: center;
      }

      /* Reveal gate: the app is fully booted behind the overlay; this is the
         one deliberate click between download and workbench. */
      #go {
        display: none;
        margin-top: 4px;
        padding: 10px 44px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        letter-spacing: 0.04em;
        color: #151515; /* canvas-dark */
        background: #68b2ef; /* accent-azure-dark */
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      #go:hover {
        background: #79b0e8; /* info-dark */
      }

      #go:focus-visible {
        outline: 2px solid #e8e8e8; /* ink-dark */
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <img class="logo" src="./sqlly2.svg" alt="SQLLY logo" />
      <div class="wordmark">SQLLY</div>
      <div class="progress-track">
        <div id="progress" class="progress-fill"></div>
      </div>
      <p id="status" class="status">Preparing…</p>
      <button id="go" type="button">Go</button>
      <div class="native-note">
        <p class="lead">
          SQLLY browser preview (in-tab demo). It cannot reach your servers.
          Installed on your machine, SQLLY is ready in under a second.
        </p>
        <p id="fact" class="fact"></p>
      </div>
    </div>
    <!-- External module (not inline) so the page loads under the marketing
         site's strict CSP without a per-path exemption — see boot.js. -->
    <script type="module" src="./boot.js"></script>
  </body>
</html>

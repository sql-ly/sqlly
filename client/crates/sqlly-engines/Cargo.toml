[package]
name = "sqlly-engines"
version = "1.34.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Native-only by construction: every backend here speaks a real network or
# file protocol (tiberius, tokio-postgres, mysql_async, rusqlite, russh).
# The browser build never depends on this crate — `sqlly-services` gates it
# behind cfg(not(target_arch = "wasm32")) and swaps in its own executors.
[dependencies]
sqlly-core = { workspace = true }
sqlly-intel = { workspace = true }
sqlly-lang = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# SQL Server
tiberius = { workspace = true }
socket2 = { workspace = true }
# PostgreSQL
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# MySQL / MariaDB
mysql_async = { workspace = true }
# SQLite
rusqlite = { workspace = true, features = ["column_decltype", "column_metadata"] }
fallible-iterator = "0.3"
# ClickHouse speaks HTTP: the workspace reqwest (rustls, no bundled crypto
# provider — the driver hands it a ring-backed config) plus `stream` for
# progressive response bodies and `query` for the URL settings.
reqwest = { workspace = true, features = ["stream", "query"] }
url = "2"
# Oracle Database (ODPI-C; loads Oracle Instant Client at runtime)
oracle = { workspace = true }
# libSQL / Turso speak Hrana over the same reqwest client; blob cells arrive
# base64-encoded.
base64 = "0.23"
# Redis / Valkey / KeyDB / Dragonfly speak RESP: the async client with the
# same rustls 0.23 the workspace pins (ring provider, webpki roots), plus the
# insecure verifier for the Require TLS mode. No typed command features: the
# driver sends raw argument lists. `sentinel` adds replica discovery for
# Sentinel profiles (it brings only `log` and `rand`, already in the lock);
# `cluster-async` routes Cluster profiles by slot.
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure", "sentinel", "cluster-async"] }
# "Also trust the OS keychain roots" for Redis TLS: the operating system's
# trust store (macOS keychain, Windows ROOT store, the Linux CA bundle). Already
# in the lock file through the AWS and redis crates.
rustls-native-certs = "0.8"
# The bundled public roots as certificates (the same Mozilla list as
# webpki-roots), so a Redis CA file or the OS store is trusted alongside
# them: the client library takes one PEM root set. Already in the lock file.
webpki-root-certs = "1"
# SSH / SOCKS / HTTP-proxy tunnelling shared by the network backends
russh = { workspace = true }
dirs = "7"
tokio-socks = "0.5"
async-http-proxy = { version = "1.2", features = ["runtime-tokio", "basic-auth"] }

# DuckDB (in-process). Everywhere but Windows, `bundled` compiles the C++
# library into the binary (a long build; needs a C++17 compiler) so users
# install nothing, and `parquet` / `json` build those extensions in so
# `read_parquet(...)` / `read_json(...)` work offline.
[target.'cfg(not(windows))'.dependencies]
duckdb = { workspace = true, features = ["bundled", "parquet", "json"] }

# Windows links DuckDB's official prebuilt duckdb.dll (parquet and json are
# built into it) instead of compiling DuckDB from source, which was the
# slowest part of the cold Windows release build. The DLL ships beside
# SQLLY.exe / sqlly-cli.exe. CI downloads it per arch and points
# DUCKDB_LIB_DIR at it (client/apps/gpui/scripts/windows-duckdb.sh); for a local
# Windows build, set DUCKDB_DOWNLOAD_LIB=1 and libduckdb-sys fetches it into
# the target dir.
[target.'cfg(windows)'.dependencies]
duckdb = { workspace = true }

[dev-dependencies]
sqlly-testkit = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
rand = { workspace = true }
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519"] }

[package]
name = "sqlly-lsp"
version = "1.10.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sqlly-lsp"
path = "src/main.rs"

[dependencies]
sqlly-services = { workspace = true }
sqlly-core = { workspace = true }
sqlly-intel = { workspace = true }
sqlly-ai = { workspace = true }
sqlly-lang = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The stdio server (bin + LspServer) needs the tokio runtime; the pure LSP
# helpers the GPUI app reuses do not, so wasm builds skip tokio entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

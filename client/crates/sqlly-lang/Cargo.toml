[package]
name = "sqlly-lang"
version = "1.18.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std::time::Instant/SystemTime panic on wasm32; web-time is the drop-in
# replacement backed by performance.now().
web-time = "1"

[[bench]]
name = "tokenizer_indexing"
harness = false

[[bench]]
name = "lex_parse"
harness = false

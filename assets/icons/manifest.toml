# =============================================================================
# SQLLY icon manifest — the single source of truth for every icon in every app.
#
# Every icon the gpui desktop app, the wasm browser build, and the native macOS
# app draw is declared here exactly once. Hugeicons glyphs are used under the MIT
# License (see assets/icons/hugeicons/LICENSE) and credited in each app's About /
# Acknowledgments screen. `tools/icons/generate.mjs` reads this file and
# regenerates, deterministically:
#
#   - assets/icons/hugeicons/<key>.svg     (currentColor-normalized SVG bytes)
#   - client/apps/gpui/src/icon_catalog.rs (Rust enum + embedded byte registry)
#   - the native macOS app's IconCatalog.generated.swift (Swift enum)
#
# NEVER edit those generated files by hand — edit this manifest and rerun the
# generator (`node tools/icons/generate.mjs`). `tools/icons/check.mjs` is the CI
# guard that fails the build if the generated artifacts drift from this file.
#
# ---------------------------------------------------------------------------
# [icons.<key>] fields (all optional except that at least one must be present):
#   gpui        SVG source the desktop + browser apps render for this key:
#                 "hugeicons:<ExportName>"  a Hugeicons free-set glyph, vendored
#                                           to assets/icons/hugeicons/<key>.svg
#                 "glyph:<file-stem>"       a hand-drawn SQLLY glyph already in
#                                           assets/glyphs/<file-stem>.svg
#   sf_symbol   macOS-native SF Symbol name. On macOS this is the PRIMARY
#               affordance (rec 5: native symbols where they genuinely win); the
#               SVG is only the fallback when the symbol is missing on the OS.
#   macos_asset Existing bundled macOS feature SVG (Resources/Icons/<name>.svg)
#               used as the macOS SVG fallback for this key.
#   mono        false = full-colour illustration (state art, brand logos); the
#               default true means the glyph tints with the surrounding text.
#   stroke_width  override the Hugeicons default stroke (1.5) for one glyph, to
#               make it read bolder at small sizes (only affects hugeicons:).
#
# [kinds]     object-explorer node kind (lowercased) -> icon key
# [sql_types] SQL Server base data type (lowercased) -> icon key
# These generate the macOS `Icon(kind:)` / `Icon(sqlDataType:)` mappers that
# replace IconLoader's hand-written switch statements.
# =============================================================================

# --- Object-explorer / schema-tree concepts -------------------------------
# gpui renders the Hugeicons glyph here; macOS prefers SF Symbols and keeps a
# feature-SVG fallback. Same semantic key, per-platform resolution.

[icons.server]
gpui = "hugeicons:ServerStack01"
sf_symbol = "network"
macos_asset = "app-shell"

